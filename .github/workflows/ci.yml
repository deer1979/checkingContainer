name: CI

on:
  push:
    branches: [main, review-navigation-stability]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  identity-functions:
    name: Validate Firebase identity function
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Build and test Functions
        run: npm --prefix functions test

      - name: Upload generated Functions lockfile
        uses: actions/upload-artifact@v4
        with:
          name: checkingcontainer-functions-lockfile
          path: functions/package-lock.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Validate debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prepare local properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL:-}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}"
          } > local.properties

      - name: Compile, test, lint and assemble
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          ./gradlew \
            :app:compileDebugKotlin \
            testDebugUnitTest \
            :core:model:test \
            :app:lintDebug \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: checkingcontainer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: checkingcontainer-release-unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkingcontainer-quality-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            **/build/reports/tests/**
            app/build/outputs/mapping/release/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish review debug release
        if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/review-navigation-stability')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="navigation-review-debug"
          short_sha="${GITHUB_SHA:0:7}"
          src_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          renamed="checkingContainer-navigation-review-${short_sha}.apk"
          cp "$src_apk" "/tmp/$renamed"
          gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "$tag" "/tmp/$renamed" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "Architecture stability review" \
            --prerelease \
            --notes "APK de diagnóstico generado por CI para el commit ${short_sha}."

      - name: Publish main rolling debug release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="latest-debug"
          short_sha="${GITHUB_SHA:0:7}"
          src_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          renamed="checkingContainer-debug-${short_sha}.apk"
          cp "$src_apk" "/tmp/$renamed"
          gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "$tag" "/tmp/$renamed" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --prerelease \
            --notes "APK debug más reciente generado desde main para el commit ${short_sha}."
