name: CI

on:
  push:
    branches: [main, review-navigation-stability]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Repair EstimadoViewModel blocks once
        if: github.event_name == 'pull_request' && github.head_ref == 'review-architecture-stability'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('feature/units/src/main/kotlin/com/checkingcontainer/feature/units/EstimadoViewModel.kt')
          text = path.read_text(encoding='utf-8')

          if 'private var activePhotoUploads = 0' not in text:
              marker = '    private var pendingMaterialCost = ""\n'
              if marker not in text:
                  raise SystemExit('Photo counter marker not found')
              text = text.replace(marker, marker + '    private var activePhotoUploads = 0\n', 1)

          safe_init = '\n'.join([
              '    init {',
              '        viewModelScope.launch {',
              '            try {',
              '                val inspectionDeferred = async { inspectionRepo.findById(inspectionId) }',
              '                val existingDeferred = async { estimadosRepo.findByInspectionId(inspectionId) }',
              '                val inspection = inspectionDeferred.await()',
              '                val unit = inspection?.containerNo?.let { reeferUnitRepo.findByContainerNo(it) }',
              '                val existing = existingDeferred.await()',
              '                _state.update {',
              '                    it.copy(',
              '                        isLoading = false,',
              '                        containerNo = inspection?.containerNo ?: "",',
              '                        technicianName = inspection?.technicianName ?: "",',
              '                        manufacturer = unit?.manufacturer ?: "",',
              '                        unitModel = unit?.unitModel ?: "",',
              '                        unitModelNo = unit?.unitModelNo ?: "",',
              '                        unitSerialNo = unit?.unitSerialNo ?: "",',
              '                        yearOfBuilt = unit?.yearOfBuilt ?: "",',
              '                        unitType = unit?.unitType ?: "",',
              '                        fichaTecnica = unit?.fichaTecnica ?: emptyList(),',
              '                        estimadoId = existing?.id ?: 0L,',
              '                        clientName = existing?.clientName ?: "",',
              '                        location = existing?.location ?: inspection?.location ?: "",',
              '                        createdAt = existing?.createdAt ?: System.currentTimeMillis(),',
              '                        approvedAt = existing?.approvedAt,',
              '                        status = existing?.status ?: EstimadoStatus.ABIERTO,',
              '                        damages = existing?.damages ?: emptyList(),',
              '                        mediciones = existing?.mediciones ?: emptyList(),',
              '                        clientId = existing?.clientId,',
              '                        clientIdNumber = existing?.clientIdNumber ?: "",',
              '                        clientDireccion = existing?.clientDireccion ?: "",',
              '                        clientTelefono = existing?.clientTelefono ?: "",',
              '                        clientEmail = existing?.clientEmail ?: "",',
              '                        sitioClienteId = existing?.sitioClienteId,',
              '                        sitioNombre = existing?.sitioNombre ?: "",',
              '                        ordenTrabajo = existing?.ordenTrabajo ?: "",',
              '                        hasIva = existing?.hasIva ?: false,',
              '                    )',
              '                }',
              '            } catch (error: Throwable) {',
              '                if (error is kotlinx.coroutines.CancellationException) throw error',
              '                _state.update {',
              '                    it.copy(',
              '                        isLoading = false,',
              '                        errorMessage = error.message ?: "No se pudo cargar el estimado",',
              '                    )',
              '                }',
              '            }',
              '        }',
              '    }',
              '',
              '    fun onEvent',
          ])
          init_pattern = re.compile(r'    init \{\n.*?\n\s*fun onEvent', re.S)
          text, count = init_pattern.subn(safe_init, text, count=1)
          if count != 1:
              raise SystemExit(f'Initial load replacements: {count}')

          safe_upload = '\n'.join([
              '    private fun uploadPhoto(itemId: String, isDano: Boolean, uri: Uri) {',
              '        viewModelScope.launch {',
              '            activePhotoUploads += 1',
              '            _state.update { it.copy(isUploadingPhoto = true, errorMessage = null) }',
              '            try {',
              '                val bytes = withContext(Dispatchers.IO) {',
              '                    compressForUpload(uri)',
              '                        ?: context.contentResolver.openInputStream(uri)?.use { it.readBytes() }',
              '                }',
              '                if (bytes == null) {',
              '                    _state.update { it.copy(errorMessage = "No se pudo leer la foto") }',
              '                    return@launch',
              '                }',
              '                runCatching {',
              '                    estimadosRepo.uploadItemPhoto(inspectionId, itemId, isDano, bytes)',
              '                }.onSuccess { url ->',
              '                    coil3.SingletonImageLoader.get(context).enqueue(',
              '                        coil3.request.ImageRequest.Builder(context).data(url).build(),',
              '                    )',
              '                    _state.update { state ->',
              '                        state.copy(',
              '                            isDirty = true,',
              '                            damages = state.damages.map { item ->',
              '                                if (item.id != itemId) item',
              '                                else if (isDano && item.damagePhotos.size < MAX_FOTOS_POR_GRUPO)',
              '                                    item.copy(damagePhotos = item.damagePhotos + url)',
              '                                else if (!isDano && item.repairPhotos.size < MAX_FOTOS_POR_GRUPO)',
              '                                    item.copy(repairPhotos = item.repairPhotos + url)',
              '                                else item',
              '                            },',
              '                        )',
              '                    }',
              '                }.onFailure { error ->',
              '                    _state.update {',
              '                        it.copy(errorMessage = error.message ?: "Error al subir foto")',
              '                    }',
              '                }',
              '            } finally {',
              '                activePhotoUploads = (activePhotoUploads - 1).coerceAtLeast(0)',
              '                _state.update { it.copy(isUploadingPhoto = activePhotoUploads > 0) }',
              '            }',
              '        }',
              '    }',
              '',
              '    /** Crea el cliente',
          ])
          upload_pattern = re.compile(
              r'    private fun uploadPhoto\(itemId: String, isDano: Boolean, uri: Uri\) \{\n.*?\n\s*/\*\* Crea el cliente',
              re.S,
          )
          text, count = upload_pattern.subn(safe_upload, text, count=1)
          if count != 1:
              raise SystemExit(f'Photo upload replacements: {count}')

          path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet -- feature/units/src/main/kotlin/com/checkingcontainer/feature/units/EstimadoViewModel.kt; then
            echo "EstimadoViewModel already repaired"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature/units/src/main/kotlin/com/checkingcontainer/feature/units/EstimadoViewModel.kt
          git commit -m "fix: corregir estructura de EstimadoViewModel"
          git push origin HEAD:review-architecture-stability

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prepare local properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL:-}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}"
          } > local.properties

      - name: Compile, test, lint and assemble
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          ./gradlew \
            :app:compileDebugKotlin \
            testDebugUnitTest \
            :core:model:test \
            :app:lintDebug \
            :app:assembleDebug \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: checkingcontainer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkingcontainer-quality-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish review debug release
        if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/review-navigation-stability')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="navigation-review-debug"
          short_sha="${GITHUB_SHA:0:7}"
          src_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          renamed="checkingContainer-navigation-review-${short_sha}.apk"
          cp "$src_apk" "/tmp/$renamed"
          gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "$tag" "/tmp/$renamed" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "Navigation stability review" \
            --prerelease \
            --notes "APK de diagnóstico generado por CI para el commit ${short_sha}."

      - name: Publish main rolling debug release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="latest-debug"
          short_sha="${GITHUB_SHA:0:7}"
          src_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          renamed="checkingContainer-debug-${short_sha}.apk"
          cp "$src_apk" "/tmp/$renamed"
          gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "$tag" "/tmp/$renamed" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --prerelease \
            --notes "APK debug más reciente generado desde main para el commit ${short_sha}."
