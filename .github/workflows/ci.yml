name: CI

on:
  push:
    branches: [main, review-navigation-stability]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply pending Estimado fix once
        if: github.event_name == 'pull_request' && github.head_ref == 'review-architecture-stability'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-shot-estimado-fix.yml').read_text(encoding='utf-8')
          start_marker = '''      - name: Apply safe loading and concurrent upload fixes
                  shell: python
                  run: |
          '''
          end_marker = '\n      - name: Commit generated change'
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('Patch source marker not found')
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('Patch end marker not found')
          block = source[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          exec(compile(script, 'one-shot-estimado-fix', 'exec'))
          PY

          if git diff --quiet -- feature/units/src/main/kotlin/com/checkingcontainer/feature/units/EstimadoViewModel.kt; then
            echo "EstimadoViewModel already patched"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature/units/src/main/kotlin/com/checkingcontainer/feature/units/EstimadoViewModel.kt
          git commit -m "fix: estabilizar carga y fotos de estimados"
          git push origin HEAD:review-architecture-stability

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prepare local properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL:-}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}"
          } > local.properties

      - name: Compile, test, lint and assemble
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          ./gradlew \
            :app:compileDebugKotlin \
            testDebugUnitTest \
            :core:model:test \
            :app:lintDebug \
            :app:assembleDebug \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: checkingcontainer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkingcontainer-quality-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish review debug release
        if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/review-navigation-stability')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="navigation-review-debug"
          short_sha="${GITHUB_SHA:0:7}"
          src_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          renamed="checkingContainer-navigation-review-${short_sha}.apk"
          cp "$src_apk" "/tmp/$renamed"
          gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "$tag" "/tmp/$renamed" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "Navigation stability review" \
            --prerelease \
            --notes "APK de diagnóstico generado por CI para el commit ${short_sha}."

      - name: Publish main rolling debug release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="latest-debug"
          short_sha="${GITHUB_SHA:0:7}"
          src_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          renamed="checkingContainer-debug-${short_sha}.apk"
          cp "$src_apk" "/tmp/$renamed"
          gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "$tag" "/tmp/$renamed" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --prerelease \
            --notes "APK debug más reciente generado desde main para el commit ${short_sha}."
